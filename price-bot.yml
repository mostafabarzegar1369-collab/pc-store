name: price-bot
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      test_url:
        description: 'برای تست: لینک یک محصول (برای اجرای عادی خالی بگذارید)'
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TEST_URL: ${{ inputs.test_url }}
        run: |
          if [ -n "$TEST_URL" ]; then python price_bot.py --test-url "$TEST_URL"; else python price_bot.py; fi
